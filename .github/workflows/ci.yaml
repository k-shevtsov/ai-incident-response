name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install ruff pytest pytest-asyncio httpx fastapi freezegun
          pip install -r ai-engine/requirements.txt

      - name: Lint ai-engine with ruff
        run: ruff check ai-engine/src/

      - name: Lint victim-service with ruff
        run: ruff check app/src/

      - name: Run tests
        run: |
          cd ai-engine
          python3 -m pytest tests/ -v --tb=short
        env:
          PYTHONPATH: src

  build-victim-service:
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push victim-service
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: |
            ghcr.io/${{ github.actor }}/victim-service:latest
            ghcr.io/${{ github.actor }}/victim-service:${{ github.sha }}

  build-ai-engine:
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ai-engine
        uses: docker/build-push-action@v6
        with:
          context: ./ai-engine
          push: true
          tags: |
            ghcr.io/${{ github.actor }}/ai-engine:latest
            ghcr.io/${{ github.actor }}/ai-engine:${{ github.sha }}
