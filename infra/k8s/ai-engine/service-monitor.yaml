apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ai-engine
  namespace: ai-engine
  labels:
    release: kube-prometheus-stack   # must match Prometheus operator's serviceMonitorSelector
spec:
  selector:
    matchLabels:
      app: ai-engine
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
