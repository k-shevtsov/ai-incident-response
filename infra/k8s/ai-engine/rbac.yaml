apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-engine
  namespace: ai-engine
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ai-engine-remediator
  namespace: app
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ai-engine-remediator
  namespace: app
subjects:
  - kind: ServiceAccount
    name: ai-engine
    namespace: ai-engine
roleRef:
  kind: Role
  apiGroup: rbac.authorization.k8s.io
  name: ai-engine-remediator
