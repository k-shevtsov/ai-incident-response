apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-engine
  namespace: ai-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-engine
  template:
    metadata:
      labels:
        app: ai-engine
    spec:
      serviceAccountName: ai-engine
      containers:
        - name: ai-engine
          image: ai-engine:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8001
          env:
            - name: PROMETHEUS_URL
              value: "http://kube-prometheus-stack-prometheus.monitoring:9090"
            - name: LOKI_URL
              value: "http://loki-gateway.monitoring"
            - name: TELEGRAM_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ai-engine-secrets
                  key: telegram-token
            - name: TELEGRAM_CHAT_ID
              valueFrom:
                secretKeyRef:
                  name: ai-engine-secrets
                  key: telegram-chat-id
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-engine-secrets
                  key: anthropic-api-key
            - name: REMEDIATION_ENABLED
              value: "false"
            - name: MAX_CLAUDE_CALLS_PER_HOUR
              value: "10"
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: ai-engine
  namespace: ai-engine
  labels:
    app: ai-engine
spec:
  selector:
    app: ai-engine
  ports:
    - name: http
      port: 80
      targetPort: 8001
