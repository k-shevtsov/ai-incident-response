apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: victim-service
  namespace: app
spec:
  ingressClassName: nginx
  rules:
  - host: victim.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: victim-service
            port:
              number: 80
