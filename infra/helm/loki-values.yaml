deploymentMode: SingleBinary

loki:
  image:
    registry: docker.io
    repository: grafana/loki
    tag: 3.4.2
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
    - from: "2024-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

singleBinary:
  replicas: 1

backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

monitoring:
  enabled: false

test:
  enabled: false

chunksCache:
  enabled: false
resultsCache:
  enabled: false
