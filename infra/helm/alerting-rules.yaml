apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: victim-service-alerts
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
  - name: victim-service
    interval: 15s
    rules:

    - alert: HighErrorRate
      expr: |
        (
          rate(http_requests_total{job="victim-service", status="500"}[2m])
          /
          rate(http_requests_total{job="victim-service"}[2m]) * 100
        ) > 30
      for: 1m
      labels:
        severity: warning
        service: victim-service
      annotations:
        summary: "High error rate on victim-service"
        description: "Error rate is {{ $value | printf \"%.1f\" }}% (threshold: 30%)"

    - alert: CriticalErrorRate
      expr: |
        (
          rate(http_requests_total{job="victim-service", status="500"}[2m])
          /
          rate(http_requests_total{job="victim-service"}[2m]) * 100
        ) > 70
      for: 30s
      labels:
        severity: critical
        service: victim-service
      annotations:
        summary: "CRITICAL error rate on victim-service"
        description: "Error rate is {{ $value | printf \"%.1f\" }}% (threshold: 70%)"

    - alert: SlowResponseTime
      expr: |
        histogram_quantile(0.95,
          rate(http_request_duration_seconds_bucket{job="victim-service"}[2m])
        ) > 2
      for: 1m
      labels:
        severity: warning
        service: victim-service
      annotations:
        summary: "Slow response time on victim-service"
        description: "p95 response time is {{ $value | printf \"%.2f\" }}s (threshold: 2s)"

    - alert: ChaosModeActive
      expr: chaos_mode_active == 1
      for: 0s
      labels:
        severity: critical
        service: victim-service
      annotations:
        summary: "Chaos mode is ACTIVE"
        description: "Chaos mode has been enabled on victim-service"
  - name: ai-engine
    interval: 30s
    rules:
    - alert: AIEngineDown
      expr: up{job="ai-engine"} == 0
      for: 1m
      labels:
        severity: critical
        service: ai-engine
      annotations:
        summary: "AI Engine is down"
        description: "ai-engine pod is not reachable by Prometheus"
    - alert: AIEngineClaudeHighLatency
      expr: |
        histogram_quantile(0.95,
          rate(ai_engine_claude_request_duration_seconds_bucket[5m])
        ) > 10
      for: 2m
      labels:
        severity: warning
        service: ai-engine
      annotations:
        summary: "Claude API p95 latency > 10s"
        description: "Claude p95 latency is {{ $value | printf \"%.1f\" }}s (threshold: 10s)"
    - alert: AIEngineHighRemediationFailures
      expr: |
        rate(ai_engine_remediations_total{status="failed"}[5m]) > 0
      for: 1m
      labels:
        severity: warning
        service: ai-engine
      annotations:
        summary: "AI Engine remediation failures detected"
        description: "Remediation actions are failing"
